name: flutter_blue_ultra
description: Flutter plugin for connecting and communicating with Bluetooth Low Energy devices.
version: 2.2.0
homepage: https://github.com/dotintent/flutter_blue_ultra
repository: https://github.com/dotintent/flutter_blue_ultra
issue_tracker: https://github.com/dotintent/flutter_blue_ultra/issues
documentation: https://pub.dev/documentation/flutter_blue_ultra/latest/
topics:
  - bluetooth
  - ble
  - bluetooth-low-energy
  - gatt
  - iot
funding:
  - https://withintent.com

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  # Use caret constraints to allow compatible versions
  # This allows users to use the package with other packages that depend on these
  flutter_blue_ultra_platform_interface: ^2.1.0
  flutter_blue_ultra_android: ^2.1.0
  flutter_blue_ultra_darwin: ^2.1.0
  flutter_blue_ultra_linux: ^2.1.0
  flutter_blue_ultra_web: ^2.1.0
  flutter_blue_ultra_accessory_setup: '>=0.0.4 <0.2.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_blue_ultra_android
      ios:
        default_package: flutter_blue_ultra_darwin
      linux:
        default_package: flutter_blue_ultra_linux
      macos:
        default_package: flutter_blue_ultra_darwin
      web:
        default_package: flutter_blue_ultra_web
